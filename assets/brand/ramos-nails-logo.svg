<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200"
    role="img" aria-label="Ramos Nails">
    <title>Ramos Nails</title>

    <!--
        Logotipo horizontal de Ramos Nails: monograma más marca denominativa.

        Provisional y tipográfico, sin clipart y con fondo transparente.
        Sustituible por el logotipo definitivo cuando exista.
    -->

    <g>
        <circle cx="100" cy="100" r="72" fill="#fdfaf7" />
        <circle cx="100" cy="100" r="64" fill="none" stroke="#c9a86a" stroke-width="1.5" opacity="0.85" />
        <text x="100" y="100" text-anchor="middle" dominant-baseline="central"
            font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
            font-size="56" font-weight="600" letter-spacing="2" fill="#833243">RN</text>
    </g>

    <g>
        <text x="205" y="82"
            font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
            font-size="52" font-weight="700" letter-spacing="6" fill="#833243">RAMOS</text>

        <rect x="207" y="100" width="228" height="1.2" fill="#c9a86a" opacity="0.9" />

        <text x="207" y="140"
            font-family="'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="30" font-weight="400" letter-spacing="15" fill="#6b2739">NAILS</text>
    </g>
</svg>
